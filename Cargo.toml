[workspace]
resolver = "2"
members = [
    "crates/fitkit-core",
    "crates/fitkit-dp",
    "crates/fitkit-fit",
    "crates/fitkit-feasible",
    "crates/fitkit-ledger",
    "crates/fitkit-guards",
    "crates/fitkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/czearing/fitkit"
authors = ["czearing"]

[workspace.dependencies]
fitkit-core = { version = "0.1.0", path = "crates/fitkit-core", default-features = false }
fitkit-dp = { version = "0.1.0", path = "crates/fitkit-dp", default-features = false }
fitkit-fit = { version = "0.1.0", path = "crates/fitkit-fit", default-features = false }
fitkit-feasible = { version = "0.1.0", path = "crates/fitkit-feasible", default-features = false }
fitkit-ledger = { version = "0.1.0", path = "crates/fitkit-ledger", default-features = false }
fitkit-guards = { version = "0.1.0", path = "crates/fitkit-guards", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
# Counts and lengths become f64 for scoring. Exact below 2^52, which no pool or span reaches.
cast_precision_loss = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

